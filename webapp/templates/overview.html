<div class="dashboard-container">
  <header class="dashboard-header">
    <span class="header-title">Financial Planning Advisor</span>
    <div class="header-actions">
      <button class="btn-secondary">Publish</button>
      <button class="btn-secondary">Settings</button>
    </div>
  </header>

  <div class="main-content">
    <div class="card details-card">
      <div class="card-header">
        <h3 class="card-title">Details</h3>
        <button class="btn-link">Edit</button>
      </div>
      <div class="card-body">
        <div class="detail-item">
          <i class="fas fa-leaf icon-green"></i>
          <span class="detail-name">Financial Planning Advisor</span>
        </div>
        <p class="description">This is the financial planning advisor. Use it when customers want plans to achieve their financial goals.</p>
      </div>
    </div>

    <div class="card analytics-card">
      <div class="card-header">
        <h3 class="card-title">Analytics</h3>
      </div>
      <div class="card-body analytics-grid">
        <div class="analytics-metric">
          <span class="metric-value">20,356</span>
          <span class="metric-label">Total sessions</span>
        </div>

        <div class="analytics-metric">
          <span class="metric-value">95% <i class="fas fa-arrow-up icon-green"></i></span>
          <span class="metric-label">Engagement</span>
        </div>

        <div class="analytics-metric center-action">
          <button class="btn-primary-outline" type="button" onclick="window.location.href='{{ url_for('setup_experiment') }}'">
            <i class="fas fa-flask icon-green"></i> Run experiment
          </button>
          <button class="btn-link" type="button" onclick="window.location.href='{{ url_for('results') }}'">Open</button>
        </div>

        <div class="analytics-metric">
          <span class="metric-value">3/5 <i class="fas fa-arrow-up icon-green"></i></span>
          <span class="metric-label">Satisfaction score</span>
        </div>

        <div class="analytics-metric">
          <span class="metric-value">575</span>
          <span class="metric-label">Total runs</span>
        </div>

        <div class="analytics-metric">
          <span class="metric-value red-text">36 <i class="fas fa-arrow-up icon-red"></i></span>
          <span class="metric-label">Failure tests</span>
        </div>

        <div class="analytics-metric">
          <span class="metric-value">72% <i class="fas fa-arrow-up icon-green"></i></span>
          <span class="metric-label">Pass rate</span>
        </div>

        <div class="analytics-metric">
          <button class="btn-link" type="button" onclick="window.location.href='{{ url_for('results') }}'">Open</button>
        </div>
      </div>
    </div>
  </div>
</div>
